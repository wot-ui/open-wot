      <h1>隐私政策。</h1>
      <p>最后更新：2026 年 7 月 23 日。</p>
      <h2>默认不追踪</h2>
      <p>本项目官网不会主动使用分析服务、广告追踪器、账号系统或联系表单。Open Wot CLI 将组件知识打包在本地使用，不需要在线文档 API Key。</p>
      <h2>第三方服务</h2>
      <p>GitHub、npm 与 wot-ui 链接受对应服务自身政策约束。网站通过 Google Fonts 加载 JetBrains Mono，浏览器可能向其发送标准连接信息。</p>
      <h2>联系我们</h2>
      <p>如有隐私问题，请在 <a href="https://github.com/wot-ui/open-wot/issues">Open Wot 仓库</a>提交 Issue。</p>

catalogMode: prefer

ignoreWorkspaceRootCheck: true

shellEmulator: true

trustPolicy: no-downgrade

# Already present in the existing CLI lockfile; keep the exception pinned to the
# exact reviewed version while retaining no-downgrade checks for every new package.
trustPolicyExclude:
  - chokidar@4.0.3

packages:
  - apps/*
  - playground
  - examples/*

catalog:
  '@cloudflare/vite-plugin': 1.37.1
  '@fission-ai/openspec': 1.9.0
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  '@vitejs/plugin-react': 6.0.2
  '@vitejs/plugin-rsc': 0.5.26
  '@vitest/coverage-v8': 4.0.15
  baseline-browser-mapping: ^2.10.18
  marked: 18.0.7
  next: 16.2.6
  react: 19.2.6
  react-dom: 19.2.6
  react-server-dom-webpack: 19.2.6
  vinext: 0.0.50
  vite: 8.0.13
  wrangler: 4.92.0

catalogs:
  cli:
    '@antfu/eslint-config': ^6.6.1
    '@antfu/ni': ^28.0.0
    '@cfworker/json-schema': ^4.1.1
    '@modelcontextprotocol/server': 2.0.0-alpha.2
    '@vue/compiler-sfc': ^3.5.13
    bumpp: ^10.3.2
    commander: ^14.0.0
    eslint: ^9.39.2
    jsonc-parser: ^3.3.1
    lint-staged: ^16.2.7
    publint: ^0.3.16
    simple-git-hooks: ^2.13.1
    smol-toml: ^1.7.0
    tsdown: ^0.17.3
    tsx: ^4.21.0
    typescript: ^5.9.3
    zod: ^4.1.12
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    vitest: ^4.0.15
  types:
    '@types/node': ^25.0.1

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
